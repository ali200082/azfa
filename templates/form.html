{% extends "base.html" %}
{% block title %}{{ action }} طالب{% endblock %}
{% block content %}
<div class="card">
  <h2>{{ action }} طالب</h2>
  <form method="post" class="student-form">
    {% for name, ftype in fields %}
    <label>
      <span>{{ name }}</span>
      <input type="{{ ftype }}" name="{{ name }}"
             value="{{ student.get(name, '') }}"
             {% if name == 'الاسم' %}required{% endif %}
             {% if ftype == 'number' %}step="any" min="0"{% endif %}>
    </label>
    {% endfor %}
    <div class="form-actions">
      <button type="submit" class="btn-primary">💾 حفظ</button>
      <a href="{{ url_for('index') }}" class="btn-link">إلغاء</a>
    </div>
  </form>
</div>
{% endblock %}
